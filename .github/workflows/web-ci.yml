name: Web CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Validar tipos, lint e build (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Realizar checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Executar linter
        working-directory: web
        run: npm run lint

      - name: Validar build e tipos TypeScript
        working-directory: web
        run: npm run build
