name: Web CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Validar tipos, lint e build (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Realizar checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Executar linter
        working-directory: web
        run: npm run lint

      - name: Validar build e tipos TypeScript
        working-directory: web
        run: npm run build

  deploy:
    name: Deploy em Produção (Web)
    needs: build-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}

    steps:
      - name: Disparar Deploy Hook da Web
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$DEPLOY_HOOK_URL"
