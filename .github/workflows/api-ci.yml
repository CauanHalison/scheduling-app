name: API CI

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Compilar e executar testes (API)
    runs-on: ubuntu-latest

    steps:
      - name: Realizar checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
          cache: "maven"
          cache-dependency-path: "api/pom.xml"

      - name: Permissão de execução para o Maven Wrapper
        working-directory: api
        run: chmod +x ./mvnw

      - name: Executar testes com Maven
        working-directory: api
        run: ./mvnw clean verify -B
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  deploy:
    name: Deploy em Produção (API)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.API_DEPLOY_HOOK_URL }}

    steps:
      - name: Disparar Deploy Hook da API
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$DEPLOY_HOOK_URL"
