server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: scheduling-api
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:15432}/${DB_NAME:scheduling_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL:false}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /docs

logging:
  pattern:
    level: "%5p [reqId=%X{requestId:-system}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  reminder:
    initial-delay-ms: ${REMINDER_INITIAL_DELAY_MS:60000}
    interval-ms: ${REMINDER_INTERVAL_MS:900000}
  mail:
    from: ${MAIL_FROM:no-reply@scheduling.local}
